<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Japanese Lacquer Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="kanjiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Shape -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Inner Elegant Gold / Glass Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Sun Crest Ambient Glow -->
  <circle cx="256" cy="230" r="160" fill="#f43f5e" opacity="0.22" />

  <!-- Authentic 4-Kanji Crest: 日本 (Nihon) & 先生 (Sensei) -->
  <g filter="url(#kanjiShadow)" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-weight="900" text-anchor="middle">
    <!-- Left Column: 日本 (Nihon) in Pure Brilliant White -->
    <text x="180" y="200" font-size="124" fill="#ffffff" letter-spacing="-2">日</text>
    <text x="180" y="325" font-size="124" fill="#ffffff" letter-spacing="-2">本</text>

    <!-- Divider Line with Gold Diamond -->
    <line x1="256" y1="120" x2="256" y2="340" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="8 6" />

    <!-- Right Column: 先生 (Sensei) in Warm Gold -->
    <text x="332" y="200" font-size="124" fill="url(#goldGrad)" letter-spacing="-2">先</text>
    <text x="332" y="325" font-size="124" fill="url(#goldGrad)" letter-spacing="-2">生</text>
  </g>

  <!-- Bottom Branding Badge: NIHONGO MASTER -->
  <g transform="translate(256, 415)">
    <rect x="-140" y="-22" width="280" height="42" rx="21" fill="#0b1120" fill-opacity="0.75" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">
      NIHONGO MASTER
    </text>
  </g>
</svg>
